<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>觀光產業看盤日報 ‧ 歷史報表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f2ede4;--ink:#1c2330;--navy:#2b3a52;--line:#d9d0be;--muted:#7a7264;--card:#fbf8f2;}
  *{box-sizing:border-box}
  body{margin:0;padding:28px 20px 48px;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
  .wrap{max-width:720px;margin:0 auto}
  nav{display:flex;gap:8px;margin-bottom:16px}
  nav a{font-size:13px;padding:6px 14px;text-decoration:none;border-radius:2px;
    background:var(--card);border:1px solid var(--line);color:var(--navy)}
  nav a:hover{background:#f5efe4}
  nav a.on{background:var(--navy);border-color:var(--navy);color:#f2ede4}
  nav a:focus-visible,ul a:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
  header{border-bottom:2px solid var(--navy);padding-bottom:14px;margin-bottom:20px}
  h1{font-size:26px;font-weight:700;letter-spacing:2px;margin:0 0 6px;color:var(--navy)}
  .sub{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--muted);letter-spacing:.5px}
  ul{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line)}
  li{border-bottom:1px solid var(--line)}
  li:last-child{border-bottom:none}
  ul a{display:flex;align-items:baseline;gap:14px;padding:11px 16px;
    text-decoration:none;color:var(--ink)}
  ul a:hover{background:#f5efe4}
  li:first-child a{box-shadow:inset 3px 0 0 var(--navy)}
  .dt{font-family:"JetBrains Mono",monospace;font-size:15px;font-weight:700}
  .wd{font-size:12px;color:var(--muted)}
  footer{margin-top:16px;font-size:11px;color:var(--muted);line-height:1.7}
  @media (max-width:600px){body{padding:18px 12px 36px}}
</style>
</head>
<body>
<div class="wrap">

<nav>
  <a href="index.html">最新報表</a>
  <a class="on" href="history.html">歷史報表</a>
</nav>

<header>
  <h1>歷史報表</h1>
  <div class="sub">保留最近 30 期　｜　目前共 1 期</div>
</header>

<ul>
    <li><a href="reports/2026-09-14.html"><span class="dt">2026/09/14</span><span class="wd">星期一</span></a></li>
</ul>

<footer>
  清單依日期由新到舊排列，最上方一筆即為最新報表。<br>
  資料來源：臺灣證券交易所 MI_INDEX ／ Google Sheets「STOCK DAILY UPDATE」StockData 分頁。
</footer>

</div>
</body>
</html>
